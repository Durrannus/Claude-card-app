<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Card Logger</title>
  <meta name="description" content="Riftbound collection and market tracker: spot the right time to buy and sell.">
  <meta name="theme-color" content="#0e1726">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Card Logger">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="loading" id="loading">
    <img class="logo" src="icons/icon-192.png" alt="">
    <div class="spinner"></div>
    <div class="msg" id="loading-msg">Starting…</div>
  </div>

  <header class="top">
    <h1 id="title">Collection</h1>
    <div class="sub" id="subtitle"></div>
  </header>
  <main id="view"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="collection"><span class="ico">▦</span>Collection</button>
    <button data-tab="meta"><span class="ico">⚔︎</span>Meta</button>
    <button data-tab="market"><span class="ico">↗</span>Market</button>
    <button data-tab="insight"><span class="ico">✦</span>Insight</button>
    <button data-tab="more"><span class="ico">⋯</span>More</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
