# Builds and publishes the iPhone (web) app on GitHub Pages, with fresh
# prices, exchange rates and decklists, every morning and whenever the app
# changes. The market database is kept on the phone-data branch between
# runs so price history and decklists build up over time.
#
# One-time setup (repository Settings):
#   Pages → Build and deployment → Source: GitHub Actions
#   Secrets and variables → Actions → New repository secret: TOPDECK_API_KEY (optional)
name: Phone app

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["phone/**", "card_logger/**", ".github/workflows/phone.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: phone-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get the saved market data
        run: |
          if git fetch --depth 1 origin phone-data; then
            git show FETCH_HEAD:shared.db > shared.db
            ls -l shared.db
          else
            echo "First run: starting a new market database"
          fi

      - name: Update prices and decklists, build the site
        env:
          TOPDECK_API_KEY: ${{ secrets.TOPDECK_API_KEY }}
        run: python -m card_logger.phone_build --db shared.db --site _site

      - name: Save the market data for tomorrow
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/phone-data && cp shared.db /tmp/phone-data/
          cd /tmp/phone-data
          git init -q -b phone-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared.db
          git commit -q -m "Market data $(date -u +%F)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" phone-data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
